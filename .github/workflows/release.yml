name: Release

# Push a tag like v0.3.0 to build the Windows installer and attach it to a
# draft GitHub Release (review it, then publish by hand).
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Unit tests
        run: npm test

      # Optional code signing. Runs only when both repo secrets exist; without
      # them the build stays unsigned exactly as before.
      # WINDOWS_CERT_PFX_BASE64 = base64 of the .pfx, WINDOWS_CERT_PASSWORD = its password.
      # NOTE: a self-signed certificate does NOT satisfy Windows Smart App Control
      # or SmartScreen; it only signs the files (publisher still "unknown").
      - name: Import signing certificate (optional)
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:PFX_BASE64) -or [string]::IsNullOrEmpty($env:PFX_PASSWORD)) {
            Write-Host "No signing secrets set - building unsigned."
            "args=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "vellum-sign.pfx"
          try {
            $bytes = [Convert]::FromBase64String($env:PFX_BASE64.Trim())
          } catch {
            throw "WINDOWS_CERT_PFX_BASE64 is not valid base64 (length $($env:PFX_BASE64.Length)): $($_.Exception.Message)"
          }
          # Sanity check without revealing anything: a PKCS#12 file is a few KB and starts with 0x30.
          Write-Host ("PFX secret decodes to {0} bytes, first byte 0x{1:X2}; password length {2}" -f $bytes.Length, $bytes[0], $env:PFX_PASSWORD.Length)
          if ($bytes.Length -lt 1000 -or $bytes[0] -ne 0x30) {
            throw "WINDOWS_CERT_PFX_BASE64 does not look like a .pfx file. Re-create the secret from the full base64 text of the .pfx."
          }
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $secure = ConvertTo-SecureString -String $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $pfx -Force
          $conf = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5
          Set-Content -Path "src-tauri/tauri.sign.conf.json" -Value $conf -Encoding utf8
          Write-Host "Signing enabled with certificate $($cert.Subject)"
          "args=--config src-tauri/tauri.sign.conf.json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ steps.cert.outputs.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Vellum ${{ github.ref_name }}"
          releaseBody: "See the README for what's new. Installer: Vellum_*_x64-setup.exe"
          releaseDraft: true
          prerelease: false
