name: Release

# Push a tag like v0.3.0 to build the Windows installer and attach it to a
# draft GitHub Release (review it, then publish by hand).
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Unit tests
        run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vellum ${{ github.ref_name }}"
          releaseBody: "See the README for what's new. Installer: Vellum_*_x64-setup.exe"
          releaseDraft: true
          prerelease: false
